name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (errors and undefined names)
        # E9/F rules only: syntax errors, undefined names, unused imports,
        # f-string and redefinition mistakes. Style rules are deliberately
        # excluded. An undefined-name check would have caught the
        # CupyDenseSolver.update_diag NameError, which no CI test can
        # reach without a GPU runner.
        run: ruff check --select E9,F src/

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Backends each leg installs. test_required_solvers_are_available
        # fails if one of them stops importing, instead of its parametrized
        # tests silently disappearing from the run.
        include:
          - os: ubuntu-latest
            required-solvers: SCIPY,SCIPY_DENSE,UMFPACK,QDLDL,CHOLMOD,EIGEN,MUMPS,PARDISO
          - os: windows-latest
            required-solvers: SCIPY,SCIPY_DENSE,UMFPACK,QDLDL,CHOLMOD,EIGEN,PARDISO
          - os: macos-latest
            required-solvers: SCIPY,SCIPY_DENSE,UMFPACK,QDLDL,CHOLMOD,EIGEN,MUMPS,ACCELERATE

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          activate-environment: test-env
          python-version: ${{ matrix.python-version }}
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict

      - name: Install pip
        shell: bash -l {0}
        run: conda install -y pip

      # MKL Pardiso is not available on macOS.
      - name: Install MKL Pardiso
        if: matrix.os != 'macos-latest'
        shell: bash -l {0}
        run: pip install py-mkl-pardiso

      # Petsc4py is not available on Windows
      - name: Install POSIX-only dependencies
        if: matrix.os != 'windows-latest'
        shell: bash -l {0}
        run: conda install -y -c conda-forge petsc4py

      # macldlt (Apple Accelerate) is macOS only
      - name: Install macldlt (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash -l {0}
        run: python -m pip install macldlt

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge suitesparse scikit-umfpack nanoeigenpy
          python -m pip install 'scikit-sparse>=0.5'
          python -m pip install -U pip
          python -m pip install qdldl pytest pytest-cov
          python -m pip install -e .[test] || python -m pip install -e .

      - name: Run tests with coverage
        shell: bash -l {0}
        # Coverage is reported on every leg, not gated: each installs a
        # different subset of the optional linear solvers, so the figure
        # differs per leg and a single threshold would move with whichever
        # packages resolve.
        env:
          QTQP_REQUIRED_SOLVERS: ${{ matrix.required-solvers }}
        run: |
          pytest --cov --cov-report=term-missing

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build twine
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=qtqp--pypi \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=qtqp--pypi \
              --quiet || true
          done

      - name: Publish to OSS Exit Gate
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set +x
          export TWINE_USERNAME="oauth2accesstoken"
          export TWINE_PASSWORD="$(gcloud auth print-access-token)"
          twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/qtqp--pypi/ \
            --non-interactive \
            --skip-existing \
            dist/*
          unset TWINE_PASSWORD
          printf '{"publish_all": true}\n' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/qtqp/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
