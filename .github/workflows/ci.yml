name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (errors and undefined names)
        # E9/F rules only: syntax errors, undefined names, unused imports,
        # f-string and redefinition mistakes. Style rules are deliberately
        # excluded. An undefined-name check would have caught the
        # CupyDenseSolver.update_diag NameError, which no CI test can
        # reach without a GPU runner.
        run: ruff check --select E9,F src/

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          activate-environment: test-env
          python-version: ${{ matrix.python-version }}
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict

      - name: Install pip
        shell: bash -l {0}
        run: conda install -y pip

      # MKL Pardiso is not available on macOS.
      - name: Install MKL Pardiso
        if: matrix.os != 'macos-latest'
        shell: bash -l {0}
        run: pip install py-mkl-pardiso

      # Petsc4py is not available on Windows
      - name: Install POSIX-only dependencies
        if: matrix.os != 'windows-latest'
        shell: bash -l {0}
        run: conda install -y -c conda-forge petsc4py

      # macldlt (Apple Accelerate) is macOS only
      - name: Install macldlt (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash -l {0}
        run: python -m pip install macldlt

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge suitesparse scikit-umfpack nanoeigenpy
          python -m pip install 'scikit-sparse>=0.5'
          python -m pip install -U pip
          python -m pip install qdldl pytest
          python -m pip install -e .[test] || python -m pip install -e .

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true
          # repository-url: https://test.pypi.org/legacy/
          # skip-existing: true
