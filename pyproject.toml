[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtqp"
version = "0.0.7"
description = "The 'cutie' QP solver."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{name = "Brendan O'Donoghue", email = "bodonoghue85@gmail.com"}]
requires-python = ">=3.11"

# Runtime deps (install-time)
dependencies = [
  "numpy>=1.25.2",
  "scipy>=1.16",
  "py-mkl-pardiso; (platform_system == 'Linux' or platform_system == 'Windows') and platform_machine == 'x86_64'",
  "macldlt; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

# Optional linear-solver backends. Only the backends that install cleanly
# from PyPI get an extra; the rest come from conda-forge, see README.md. Each
# is imported lazily inside the wrapper's __init__, so a missing one raises
# when that backend is selected rather than at import time -- see
# solvers_sparse.py and solvers_gpu.py.
#
# LinearSolver.QDLDL. Ships wheels for every platform.
qdldl = ["qdldl"]
# LinearSolver.CUDSS and LinearSolver.CUPY_DENSE, spelled out once per CUDA
# major version: cupy publishes one wheel per toolkit, and only the matching
# nvmath-python extra pulls the cuDSS library CuDssSolver needs -- a bare
# nvmath-python does not carry it.
gpu-cu12 = [
    "cupy-cuda12x",
    "nvmath-python[cu12]",
]
gpu-cu13 = [
    "cupy-cuda13x",
    "nvmath-python[cu13]",
]

[tool.setuptools]
license-files = []
package-dir = {"" = "src"}

# Tell setuptools to find packages in the 'src' directory
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.deptry]
# The backends are imported inside the wrapper classes, under their module
# name rather than their distribution name; record the mapping instead of
# letting deptry guess it.
[tool.deptry.package_module_name_map]
py-mkl-pardiso = ["pymklpardiso"]
cupy-cuda12x = ["cupy", "cupyx"]
cupy-cuda13x = ["cupy", "cupyx"]
nvmath-python = ["nvmath"]

[tool.deptry.per_rule_ignores]
# Backends that cannot be pip dependencies: nanoeigenpy is published on
# conda-forge only, and scikit-sparse (sksparse), scikit-umfpack (scikits)
# and petsc4py publish sdists only. CI installs them from conda-forge, or
# from pip once conda-forge has supplied the SuiteSparse headers; see ci.yml.
DEP001 = ["nanoeigenpy", "sksparse", "scikits", "petsc4py"]
# The test extra is tooling, run rather than imported by src/.
DEP002 = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
# Docstring examples in the public API are part of the suite: a plain
# `pytest` run executes them, so a docstring cannot drift from behaviour
# without turning CI red.
addopts = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.coverage.run]
source = ["qtqp"]
# The CUDA backends cannot run on any CI runner we have, so counting them
# would only push the threshold below what the rest of the package can be
# held to. Lint (ruff E9,F) is what guards them instead.
omit = ["*/qtqp/solvers_gpu.py"]

[tool.coverage.report]
show_missing = true
# Coverage is reported, not gated: every CI leg installs a different subset
# of the optional linear solvers, so a threshold would move with whichever
# packages happen to resolve. test_required_solvers_are_available guards the
# case a threshold was meant to catch (a backend silently dropping out).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
