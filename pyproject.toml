[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtqp"
version = "0.0.7"
description = "The 'cutie' QP solver."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{name = "Brendan O'Donoghue", email = "bodonoghue85@gmail.com"}]
requires-python = ">=3.11"

# Runtime deps (install-time)
dependencies = [
  "numpy>=1.25.2",
  "scipy>=1.16",
  "py-mkl-pardiso; (platform_system == 'Linux' or platform_system == 'Windows') and platform_machine == 'x86_64'",
  "macldlt; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

# Optional linear-solver backends, one extra per LinearSolver member, so a
# user can ask for the backend they want without building the others. Each is
# imported lazily inside the wrapper's __init__, and a missing one raises
# rather than failing at import time -- see solvers_sparse.py/solvers_gpu.py.
#
# LinearSolver.CUDSS and LinearSolver.CUPY_DENSE. cupy-cuda12x is the CUDA 12
# wheel; on CUDA 11 install cupy-cuda11x by hand instead, which provides the
# same `cupy` and `cupyx` modules.
gpu = [
    "cupy-cuda12x",
    "nvmath-python",
]
# LinearSolver.QDLDL. Pure wheels, so this one installs anywhere.
qdldl = ["qdldl"]
# LinearSolver.CHOLMOD. Builds against SuiteSparse; see CONTRIBUTING.md for
# the conda-forge route if no headers are present.
cholmod = ["scikit-sparse>=0.5"]
# LinearSolver.UMFPACK. Also builds against SuiteSparse.
umfpack = ["scikit-umfpack"]
# LinearSolver.MUMPS, reached through PETSc. Unavailable on Windows.
mumps = ["petsc4py; platform_system != 'Windows'"]
# Every sparse backend pip can install. LinearSolver.EIGEN is missing on
# purpose: nanoeigenpy is published on conda-forge only, so there is no name
# to put here -- `conda install -c conda-forge nanoeigenpy` is the only route.
sparse = [
    "qdldl",
    "scikit-sparse>=0.5",
    "scikit-umfpack",
    "petsc4py; platform_system != 'Windows'",
]

[tool.setuptools]
license-files = []
package-dir = {"" = "src"}

# Tell setuptools to find packages in the 'src' directory
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.deptry]
# The backends are imported inside the wrapper classes, under their module
# name rather than their distribution name; record the mapping instead of
# letting deptry guess it.
[tool.deptry.package_module_name_map]
py-mkl-pardiso = ["pymklpardiso"]
scikit-sparse = ["sksparse"]
scikit-umfpack = ["scikits"]
cupy-cuda12x = ["cupy", "cupyx"]
nvmath-python = ["nvmath"]

[tool.deptry.per_rule_ignores]
# nanoeigenpy (LinearSolver.EIGEN) is conda-forge only, so it cannot be
# declared as a dependency at all. CI installs it with conda; see ci.yml.
DEP001 = ["nanoeigenpy"]
# The test extra is tooling, run rather than imported by src/.
DEP002 = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
# Docstring examples in the public API are part of the suite: a plain
# `pytest` run executes them, so a docstring cannot drift from behaviour
# without turning CI red.
addopts = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.coverage.run]
source = ["qtqp"]
# The CUDA backends cannot run on any CI runner we have, so counting them
# would only push the threshold below what the rest of the package can be
# held to. Lint (ruff E9,F) is what guards them instead.
omit = ["*/qtqp/solvers_gpu.py"]

[tool.coverage.report]
show_missing = true
# Coverage is reported, not gated: every CI leg installs a different subset
# of the optional linear solvers, so a threshold would move with whichever
# packages happen to resolve. test_required_solvers_are_available guards the
# case a threshold was meant to catch (a backend silently dropping out).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
